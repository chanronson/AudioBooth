name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS and watchOS
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -project AudioBooth/AudioBooth.xcodeproj \
            -scheme AudioBooth \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build watchOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -project AudioBooth/AudioBooth.xcodeproj \
            -scheme "AudioBooth Watch App" \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  api-tests:
    name: Run API package tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve device sim info
        id: resolve-device
        run: |
          DEVICE_ID="$(xcrun simctl list --ios devices available | grep -m1 -E '\(([0-9A-Fa-f-]{36})\)' | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')"
          echo "device-id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run API package tests
        working-directory: API
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "API-Package" \
            -destination "id=${{ steps.resolve-device.outputs.device-id }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataTests" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
